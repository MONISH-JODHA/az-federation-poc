name: "Azure-to-Azure: Workload Identity Federation POC"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  azure-to-azure-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login as Tenant A Identity (Federated)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Tenant A access
        run: |
          az account show --query "{Name:name, SubscriptionId:id, TenantId:tenantId}" -o table

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Azure-to-Azure script
        env:
          TENANT_A_ID: ${{ secrets.AZURE_TENANT_ID }}
          TENANT_B_ID: ${{ secrets.TENANT_B_ID }}
          TENANT_B_APP_CLIENT_ID: ${{ secrets.TENANT_B_APP_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: python azure_to_azure.py
