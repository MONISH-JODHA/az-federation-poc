name: "Azure-to-Azure: Cross-Tenant Access POC"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  azure-to-azure-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Azure Login to Tenant A (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: List Tenant A resources
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: python azure_to_azure.py tenant-a

      - name: Azure Login to Tenant B (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TENANT_B_APP_CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_B_ID }}
          allow-no-subscriptions: true

      - name: List Tenant B resources
        env:
          AZURE_TENANT_ID: ${{ secrets.TENANT_B_ID }}
          AZURE_CLIENT_ID: ${{ secrets.TENANT_B_APP_CLIENT_ID }}
        run: python azure_to_azure.py tenant-b
