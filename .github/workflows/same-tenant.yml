name: "Same-Tenant: Workload Identity Federation POC"

on:
  push:
    branches: [main]
  workflow_dispatch:  # manual trigger

permissions:
  id-token: write   # Required for OIDC token
  contents: read

env:
  AZURE_TENANT_ID: "2a3c08ee-32c0-4f1a-b07f-66a611ae4456"
  AZURE_CLIENT_ID: "65eb2294-49c4-4edc-b9fe-77c529f93e69"
  AZURE_SUBSCRIPTION_ID: "de1fd068-470d-4b01-8878-53281a3667c2"

jobs:
  same-tenant-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (Federated - No Secret!)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure access via CLI
        run: |
          echo "=== Logged in identity ==="
          az account show --query "{Name:name, SubscriptionId:id, TenantId:tenantId, User:user.name}" -o table
          echo ""
          echo "=== Accessible subscriptions ==="
          az account list --query "[].{Name:name, Id:id, State:state}" -o table
          echo ""
          echo "=== Resource groups ==="
          az group list --query "[].{Name:name, Location:location}" -o table || echo "(none)"
          echo ""
          echo "=== VMs ==="
          az vm list --query "[].{Name:name, Location:location, Size:hardwareProfile.vmSize}" -o table || echo "(none)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run same-tenant Python script (no secrets!)
        env:
          AZURE_TENANT_ID: ${{ env.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ env.AZURE_CLIENT_ID }}
        run: python same_tenant_federated.py
