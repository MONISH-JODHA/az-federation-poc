name: "Same-Tenant: Workload Identity Federation POC"

on:
  push:
    branches: [main]
  workflow_dispatch: # manual trigger

permissions:
  id-token: write # Required for OIDC token
  contents: read

# All credentials stored in GitHub Secrets -- nothing hardcoded
# Set these in: Repo → Settings → Secrets and variables → Actions
#   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_SUBSCRIPTION_ID

jobs:
  same-tenant-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (Federated - No Secret!)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure access via CLI
        run: |
          echo "=== Logged in identity ==="
          az account show --query "{Name:name, SubscriptionId:id, TenantId:tenantId, User:user.name}" -o table
          echo ""
          echo "=== Accessible subscriptions ==="
          az account list --query "[].{Name:name, Id:id, State:state}" -o table
          echo ""
          echo "=== Resource groups ==="
          az group list --query "[].{Name:name, Location:location}" -o table || echo "(none)"
          echo ""
          echo "=== VMs ==="
          az vm list --query "[].{Name:name, Location:location, Size:hardwareProfile.vmSize}" -o table || echo "(none)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run same-tenant Python script (no secrets!)
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: python same_tenant_federated.py
