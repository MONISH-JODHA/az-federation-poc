name: "Cross-Tenant: Workload Identity Federation POC"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  cross-tenant-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login to Home Tenant (Federated)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CROSS_TENANT_CLIENT_ID }}
          tenant-id: ${{ secrets.HOME_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: List Home Tenant resources
        run: |
          az account show --query "{Name:name, SubscriptionId:id, TenantId:tenantId}" -o table
          az account list --query "[].{Name:name, Id:id}" -o table
          az group list --query "[].{Name:name, Location:location}" -o table || echo "(none)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run cross-tenant script
        env:
          AZURE_CLIENT_ID: ${{ secrets.CROSS_TENANT_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.HOME_TENANT_ID }}
          HOME_TENANT_ID: ${{ secrets.HOME_TENANT_ID }}
        run: python cross_tenant_federated.py
